# Equipment edits use the dedicated server-side edit password, not a user JWT.
# Existing device-local flows remain public; the function validates the password for every edit.
[functions.og6-authorize-edit]
verify_jwt = false

# Device-local archival is guarded by a server-verified admin password and scoped approval token.
[functions.og6-authorize-archive]
verify_jwt = false

# Device-local restore and name management verify the administrator password on every action.
[functions.og6-authorize-maintenance]
verify_jwt = false

# Due edits require the shared server-hashed edit password and a short-lived scoped token.
[functions.og6-authorize-due-item]
verify_jwt = false
